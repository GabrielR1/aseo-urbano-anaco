{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso restringido | Aseo Urbano Anaco</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f1f5f9;
            color: #0f172a;
        }
        .card {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            padding: 36px 32px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
        }
        .badge {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            border-radius: 16px;
            background: #fef3c7;
            color: #b45309;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }
        h1 { margin: 0 0 8px; font-size: 24px; }
        p { margin: 0 0 10px; color: #475569; font-size: 14px; line-height: 1.6; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 24px; }
        a {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }
        .primary { background: #15803d; color: #ffffff; }
        .secondary { background: #f8fafc; color: #334155; border: 1px solid #cbd5e1; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">🔒</div>
        <h1>Acceso restringido</h1>
        <p>Esta sección está reservada al personal administrativo de la Dirección de Aseo Urbano.</p>
        <p>Si eres conductor, puedes transmitir tu GPS y gestionar tu jornada desde el panel móvil.</p>
        <div class="actions">
            <a href="/chofer/" class="primary">Ir al panel del conductor</a>
            <a href="/dashboard/" class="secondary">Volver al panel</a>
        </div>
    </div>
</body>
</html>
