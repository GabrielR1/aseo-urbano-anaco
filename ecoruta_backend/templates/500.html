{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error del servidor | Aseo Urbano Anaco</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f1f5f9;
            color: #0f172a;
        }
        .card {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            padding: 36px 32px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
        }
        .badge {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            border-radius: 16px;
            background: #fee2e2;
            color: #b91c1c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }
        h1 { margin: 0 0 8px; font-size: 24px; }
        p { margin: 0; color: #475569; font-size: 14px; line-height: 1.6; }
        .actions { margin-top: 24px; }
        a {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            background: #15803d;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">⚠️</div>
        <h1>Ocurrió un error inesperado</h1>
        <p>El equipo técnico registró el problema. Intenta recargar la página o vuelve al panel en unos minutos.</p>
        <div class="actions">
            <a href="/dashboard/">Volver al panel</a>
        </div>
    </div>
</body>
</html>
