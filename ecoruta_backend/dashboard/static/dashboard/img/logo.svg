<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <!-- Clean, Mature Corporate Emblem - EcoRuta Logistics -->
  <defs>
    <linearGradient id="corpGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="corpSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Container: Solid Elegant Charcoal Rounded Base -->
  <rect x="8" y="8" width="240" height="240" rx="48" ry="48" fill="#111827" stroke="#1f2937" stroke-width="2" />

  <!-- Geometric Symbol: Modern Minimalist Leaf & Circular Route Arch -->
  <g transform="translate(16, 16)">
    <!-- Outer Logistics Route Track (Clean Charcoal/Slate Arc) -->
    <path d="M 62 172 A 76 76 0 1 1 184 94" 
          fill="none" 
          stroke="url(#corpSlate)" 
          stroke-width="18" 
          stroke-linecap="round" />

    <!-- Route Waypoint Dot -->
    <circle cx="184" cy="94" r="6" fill="#94a3b8" />

    <!-- Pure Minimalist Leaf Icon (Rising diagonally, organic & geometric balance) -->
    <path d="M 68 156 C 88 178, 126 182, 154 162 C 188 138, 194 82, 196 46 C 160 48, 104 54, 80 88 C 60 116, 64 144, 68 156 Z" 
          fill="url(#corpGreen)" />

    <!-- Fine Internal Leaf Stem (Negative Space) -->
    <path d="M 82 142 C 108 126, 138 104, 176 64" 
          fill="none" 
          stroke="#111827" 
          stroke-width="6" 
          stroke-linecap="round" />
  </g>
</svg>
