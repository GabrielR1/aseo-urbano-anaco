{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRuta - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --card-border: #1e293b;
            --accent-green: #16a34a;
            --accent-green-hover: #15803d;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 40px 36px;
            width: 100%;
            max-width: 410px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
            text-align: center;
            position: relative;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: var(--accent-green);
            border-radius: 14px 14px 0 0;
        }
        .icon-box {
            width: 52px; height: 52px;
            border-radius: 12px;
            background: #0e1526;
            border: 1px solid var(--card-border);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px auto;
            padding: 4px;
        }
        .form-input {
            width: 100%;
            padding: 11px 14px;
            background: #0e1526;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: #ffffff;
            font-size: 13.5px;
            margin-top: 6px;
            outline: none;
            transition: border-color 0.15s;
        }
        .form-input:focus {
            border-color: #3b82f6;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--accent-green);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 18px;
            transition: background 0.15s;
        }
        .btn-submit:hover {
            background: var(--accent-green-hover);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="icon-box">
            <img src="{% static 'dashboard/img/logo.svg' %}?v=5" alt="EcoRuta Logo" style="width: 100%; height: 100%; object-fit: contain;">
        </div>
        <h2 style="margin: 0 0 4px 0; font-family: 'Outfit'; font-size: 22px;">EcoRuta</h2>
        <p style="color: #64748b; font-size: 13px; margin: 0 0 24px 0;">Plataforma de Gestión y Transporte</p>
        
        <form method="post" action="{% url 'login' %}" style="text-align: left;">
            {% csrf_token %}
            <div style="margin-bottom: 16px;">
                <label style="font-size: 12px; font-weight: 600; color: #94a3b8;">Usuario</label>
                <input type="text" name="username" class="form-input" required placeholder="admin">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="font-size: 12px; font-weight: 600; color: #94a3b8;">Contraseña</label>
                <input type="password" name="password" class="form-input" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-arrow-right-to-bracket" style="margin-right: 6px;"></i> Iniciar Sesión
            </button>
        </form>
    </div>
</body>
</html>
