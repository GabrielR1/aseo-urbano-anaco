databases:
  - name: ecoruta-anaco-db
    plan: free
    databaseName: ecoruta_db
    user: ecoruta_user

services:
  - type: web
    name: aseo-urbano-anaco
    runtime: python
    plan: free
    rootDir: ecoruta_backend
    buildCommand: "bash build.sh"
    startCommand: "gunicorn EcoRuta.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: ecoruta-anaco-db
          property: connectionString
